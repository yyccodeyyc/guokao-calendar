<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>2029 年度国考备考学习日历</title>
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --line:#e4e8f0; --text:#1f2733; --muted:#6b7688;
  --brand:#2f6fed; --soft:#eef3fe;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.65}
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.htop{max-width:1200px;margin:0 auto;padding:14px 18px 8px}
h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.3px}
.sub{margin-top:3px;color:var(--muted);font-size:12.5px}
nav.tabs{max-width:1200px;margin:0 auto;padding:0 12px 8px;display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{border:1px solid transparent;background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;font-size:13.5px;cursor:pointer;font-family:inherit}
nav.tabs button:hover{background:#eef1f7;color:var(--text)}
nav.tabs button.active{background:var(--brand);color:#fff;font-weight:600}
main{max-width:1200px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;box-shadow:0 1px 2px rgba(23,35,61,.04)}
.card + .card{margin-top:14px}
.ctitle{font-size:14.5px;font-weight:700;margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;align-items:start}
.calwrap{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;align-items:start}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.stat .k{color:var(--muted);font-size:12.5px}
.stat .v{font-size:23px;font-weight:700;margin-top:2px;letter-spacing:.5px}
.stat .v small{font-size:12.5px;font-weight:400;color:var(--muted);margin-left:4px}
.bar{height:7px;border-radius:999px;background:#eef1f7;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--brand);border-radius:999px}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;background:var(--soft);color:var(--brand);font-weight:600}
.badge.grey{background:#f1f3f8;color:var(--muted)}
.bignum{font-size:15px;font-weight:600}

/* 日历 */
.calnav{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.calnav .ym{font-size:16px;font-weight:700;min-width:120px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 12px;cursor:pointer;font-family:inherit;font-size:13px;color:var(--text)}
.btn:hover{border-color:#c9d3e6;background:#fafbfe}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.dow span{text-align:center;color:var(--muted);font-size:12.5px;padding:2px 0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{position:relative;min-height:82px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:5px 6px;cursor:pointer;overflow:hidden;transition:.12s}
.cell:hover{border-color:#b9c9ea;box-shadow:0 2px 8px rgba(47,111,237,.10)}
.cell.blank{background:transparent;border:1px dashed #e8ecf4;cursor:default}
.cell.out{opacity:.38}
.cell.sel{border-color:var(--brand);box-shadow:0 0 0 2px rgba(47,111,237,.18)}
.cell.today{background:#f2f7ff}
.cell.exam{border-color:#f3b8c6;background:#fff5f7}
.cell .dnum{font-size:13.5px;font-weight:700}
.cell .dnum.sun{color:#d9534f}
.cell .phstrip{position:absolute;left:0;top:0;bottom:0;width:3px;opacity:.9}
.cell .dots{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%}
.cell .cnt{font-size:11.5px;color:var(--muted);margin-top:3px}
.cell .cellbar{height:4px;border-radius:999px;background:#eef1f7;margin-top:5px;overflow:hidden}
.cell .cellbar > i{display:block;height:100%;background:#16a34a}
.cell .tag{position:absolute;right:6px;top:5px;font-size:10.5px;color:#fff;border-radius:5px;padding:0 5px}
.cell .note{font-size:11px;color:#0e7490;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 任务面板 */
.tasks{list-style:none;margin:0;padding:0}
.tasks li{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff}
.tasks li.rest{background:#fafbfe;border-style:dashed;color:#7b8794}
.tasks a.tlink{color:var(--brand);text-decoration:underline dotted;text-underline-offset:3px;font-weight:600}
.tasks a.tlink:hover{text-decoration-style:solid}
.tasks li.done{background:#f6fbf7;border-color:#cfe9d6}
.tasks li.done .tt{text-decoration:line-through;color:#8c9aa9}
.ck{width:17px;height:17px;flex:0 0 17px;margin-top:2px;cursor:pointer;accent-color:#16a34a}
.tt{font-size:13.5px}
.meta{font-size:12px;color:var(--muted);margin-top:2px}
.sbadge{display:inline-block;min-width:38px;text-align:center;font-size:11.5px;color:#fff;border-radius:6px;padding:1px 6px;font-weight:600}

/* 自检 */
.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed #edf0f6}
.checklist li:last-child{border-bottom:0}
.numtable{width:100%;border-collapse:collapse}
.numtable th,.numtable td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;font-size:13px}
.numtable th{color:var(--muted);font-weight:600;background:#fafbfe}
.numtable input{width:110px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-family:inherit;font-size:13px}
.numtable input:focus{outline:none;border-color:var(--brand)}
textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-family:inherit;font-size:13px;resize:vertical}
textarea:focus{outline:none;border-color:var(--brand)}
.phlist{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.phcard{border:1px solid var(--line);border-radius:13px;padding:11px 12px;background:#fff}
.phcard .phname{font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px}
.phcard .pdot{width:9px;height:9px;border-radius:50%}
.phcard .phrange{color:var(--muted);font-size:12px;margin:4px 0 7px}
.phcard .phgoal{font-size:12.5px;color:#33415c}
.phcard .phhours{font-size:12px;color:var(--muted);margin-top:7px}
.weekmini{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wcell{border:1px solid var(--line);border-radius:10px;padding:7px 8px;background:#fff;font-size:12.5px}
a{color:var(--brand)}
.wcell .wd{font-weight:700;font-size:12.5px}
.wcell .wdate{color:var(--muted);font-size:11.5px}
.wcell .wt{margin-top:5px;color:#33415c;font-size:11.5px;line-height:1.5}
.wcell{border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;background:var(--card-bg)}
.whead{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.whead .wd{font-weight:700;font-size:12.5px}
.whead .wdate{font-size:11px;color:var(--muted)}
.wprog{height:5px;border-radius:999px;background:rgba(120,160,220,.16);overflow:hidden}
.wprog > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.wcell .wt{display:flex;flex-direction:column;gap:4px;font-size:11.5px;line-height:1.5;margin:0;color:var(--text)}
.witem{display:flex;gap:5px;align-items:flex-start}
.wdot{width:6px;height:6px;border-radius:50%;margin-top:5px;flex:0 0 6px}
.wcell.wtoday{border-color:var(--accent);box-shadow:0 0 0 2px hsl(var(--h) 80% 60% / .18)}
.wcell.wempty{opacity:.62}
.kpirow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.kpibox{background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:12px;padding:8px 13px;min-width:118px}
html[data-theme="dark"] .kpibox{background:rgba(255,255,255,.05)}
.kpibox .k{font-size:11.5px;color:var(--muted)}
.kpibox .v{font-size:16px;font-weight:700;margin-top:2px}
.weeksel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.inline{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kpi{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.kpi div{font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font-size:17px;color:var(--text)}
footer{max-width:1200px;margin:0 auto;padding:6px 18px 30px;color:var(--muted);font-size:12px}
@media (max-width:1000px){
  .grid4{grid-template-columns:repeat(2,1fr)}
  .grid2,.calwrap{grid-template-columns:1fr}
  .phlist{grid-template-columns:1fr}
  .weekmini{grid-template-columns:repeat(2,1fr)}
  .cell{min-height:84px}
}
@media print{
  header,nav.tabs,.calnav,.btn{display:none!important}
  body{background:#fff}
  .card{break-inside:avoid;box-shadow:none}
}

/* ================= 主题 v2：卡片加玻璃质感 ================= */
:root{
  --h:214;
  --accent:hsl(var(--h) 72% 52%);
  --accent-2:hsl(calc(var(--h) + 45) 78% 58%);
  --accent-soft:hsl(var(--h) 85% 95%);
  --text:#1c2634; --muted:#6a7a90; --line:rgba(26,58,110,.10);
  --card-bg:rgba(255,255,255,.76); --shadow:0 10px 28px rgba(27,52,96,.10);
}
html[data-theme="dark"]{
  --text:#e6ecf5; --muted:#9db0c8; --line:rgba(255,255,255,.12);
  --card-bg:rgba(26,34,48,.72); --accent-soft:rgba(255,255,255,.07);
  --shadow:0 10px 28px rgba(0,0,0,.38);
}
body{
  font-family:"LXGW WenKai","霞鹜文楷","HarmonyOS Sans SC","MiSans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:
    radial-gradient(1100px 560px at 10% -10%,hsl(var(--h) 88% 93%),transparent 60%),
    radial-gradient(900px 480px at 92% -6%,hsl(calc(var(--h) + 42) 86% 94%),transparent 58%),
    linear-gradient(180deg,#f4f7fc,#e9eff8 62%,#eef2f9);
  background-attachment:fixed;
  color:var(--text);
}
html[data-theme="dark"] body{
  background:
    radial-gradient(1100px 560px at 10% -10%,hsl(var(--h) 45% 18%),transparent 60%),
    radial-gradient(900px 480px at 92% -6%,hsl(calc(var(--h) + 42) 45% 17%),transparent 58%),
    linear-gradient(180deg,#0f1522,#0b111b 62%,#0e1420);
}
header{background:rgba(255,255,255,.55);border-bottom:1px solid var(--line);backdrop-filter:blur(14px) saturate(1.2)}
html[data-theme="dark"] header{background:rgba(16,22,34,.62)}
.htop{display:flex;align-items:center;gap:16px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-logo{width:42px;height:42px;flex:0 0 42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;color:#fff;background:linear-gradient(140deg,var(--accent),var(--accent-2));box-shadow:0 8px 18px hsl(var(--h) 70% 60% / .35)}
h1{font-size:20px;letter-spacing:.4px}
.hero-right{display:flex;align-items:center;gap:14px}
.clock{text-align:right;line-height:1.2}
.clock-time{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px;background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.clock-date{font-size:12px;color:var(--muted)}
.hero-tools{display:flex;align-items:center;gap:10px}
.iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.72);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--text);padding:0}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
html[data-theme="dark"] .iconbtn{background:rgba(255,255,255,.07)}
.hue{width:92px;accent-color:var(--accent)}
nav.tabs{gap:8px;padding:0 12px 10px}
nav.tabs button{border:1px solid var(--line);background:rgba(255,255,255,.6);color:var(--muted);padding:7px 16px;border-radius:999px;font-weight:600}
html[data-theme="dark"] nav.tabs button{background:rgba(255,255,255,.06)}
nav.tabs button.active{background:linear-gradient(120deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff;box-shadow:0 6px 16px hsl(var(--h) 70% 60% / .35)}
.card{background:var(--card-bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(10px) saturate(1.15);padding:15px 17px}
.stat{background:var(--card-bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.stat .v{font-size:25px;letter-spacing:.5px}
.bar{background:rgba(120,150,200,.16)}
.bar > i{background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.badge{background:var(--accent-soft);color:var(--accent);font-weight:600}
html[data-theme="dark"] .badge{background:rgba(255,255,255,.08)}
.btn{border-radius:999px;background:rgba(255,255,255,.72);border:1px solid var(--line);padding:6px 15px}
.btn:hover{border-color:var(--accent);color:var(--accent);background:#fff}
html[data-theme="dark"] .btn{background:rgba(255,255,255,.07)}
.btn.primary{background:linear-gradient(120deg,var(--accent),var(--accent-2));border-color:transparent}
.cell{border-radius:14px;background:var(--card-bg);border:1px solid var(--line)}
.cell:hover{box-shadow:0 8px 20px rgba(28,52,96,.14);transform:translateY(-1px)}
.cell.sel{border-color:var(--accent);box-shadow:0 0 0 2px hsl(var(--h) 80% 60% / .25)}
.cell.today{background:hsl(var(--h) 85% 96%)}
html[data-theme="dark"] .cell.today{background:rgba(255,255,255,.06)}
.cell .cellbar > i{background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.tasks li{border-radius:12px;background:var(--card-bg);border:1px solid var(--line)}
.tasks li.done{background:hsl(150 45% 96%);border-color:hsl(150 40% 84%)}
html[data-theme="dark"] .tasks li.done{background:rgba(60,140,100,.14);border-color:rgba(60,140,100,.3)}
.phcard,.wcell{border-radius:14px;background:var(--card-bg);border:1px solid var(--line)}
.numtable input,textarea{border-radius:10px;background:rgba(255,255,255,.78);border:1px solid var(--line);color:var(--text)}
html[data-theme="dark"] .numtable input,html[data-theme="dark"] textarea{background:rgba(255,255,255,.06)}
.numtable th{background:rgba(255,255,255,.42)}
html[data-theme="dark"] .numtable th{background:rgba(255,255,255,.05)}
.checklist li{border-bottom-color:var(--line)}
.tasks a.tlink{color:var(--accent)}
.hero-clock{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
.bigclock{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:2px;line-height:1.05;background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.bigdate{color:var(--muted);font-size:13px;margin-top:2px}
.hero-side{display:flex;gap:26px;flex-wrap:wrap}
.hero-side .k{color:var(--muted);font-size:12.5px}
.hero-side .v{font-size:18px;font-weight:700}

/* ================= 迷你月历、时间进度、光标光晕 ================= */
.ovgrid{display:grid;grid-template-columns:298px 1fr;gap:14px;align-items:start}
@media (max-width:900px){.ovgrid{grid-template-columns:1fr}}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mhead .mym{font-weight:700;font-size:15px;letter-spacing:.3px}
.mnav{width:30px;height:30px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.7);cursor:pointer;color:var(--muted);font-size:14px;line-height:1;padding:0}
.mnav:hover{border-color:var(--accent);color:var(--accent)}
.mfoot{display:flex;justify-content:space-between;margin-top:9px}
.mnav.expand{font-size:15px}
.mnav.expand:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
html[data-theme="dark"] .mnav{background:rgba(255,255,255,.06)}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.mcal .mdow{text-align:center;color:var(--muted);font-size:12px;padding:2px 0}
.mcell{position:relative;height:34px;display:flex;align-items:center;justify-content:center;border-radius:11px;font-size:13.5px;cursor:pointer;background:rgba(120,160,220,.10);border:1px solid transparent;transition:.14s}
.mcell.mhas{background:hsl(var(--h) 80% 94%)}
html[data-theme="dark"] .mcell.mhas{background:rgba(255,255,255,.07)}
.mcell.mout{background:transparent;color:rgba(130,150,180,.42);cursor:default}
.mcell:hover{border-color:var(--accent)}
.mcell.msel{background:linear-gradient(140deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 6px 14px hsl(var(--h) 70% 60% / .35)}
.mcell.mtoday:not(.msel){border-color:var(--accent);color:var(--accent);font-weight:700}
.mcell.mdone::after{content:'';position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.prog{margin-bottom:11px}
.prog:last-child{margin-bottom:0}
.prog .pt{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:5px}
.prog .pv{font-weight:700;font-size:14px}
.prog .pl{color:var(--muted)}
.prog .pb{height:9px;border-radius:999px;background:rgba(120,160,220,.16);overflow:hidden}
.prog .pb > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.cd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.cd .cdl{font-size:12.5px;color:var(--muted)}
.cd .cdn{font-size:15px;font-weight:700;margin-top:3px}
.cd .cdd{font-size:12px;color:var(--muted);margin-top:2px}
.cd .cdbig{font-size:36px;font-weight:800;line-height:1;background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.cd .cdu{font-size:12.5px;color:var(--muted);margin-left:3px}

/* ================= 浮岛导航、右侧悬浮钮、重点框 ================= */
header{top:10px;max-width:1180px;margin:10px auto 0;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.hlbox{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--muted);margin-bottom:9px}
html[data-theme="dark"] .hlbox{background:rgba(255,255,255,.06);color:var(--muted)}
.fab-wrap{position:fixed;right:18px;bottom:24px;display:flex;flex-direction:column;gap:10px;z-index:40}
.fab{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card-bg);color:var(--text);cursor:pointer;
  box-shadow:var(--shadow);backdrop-filter:blur(10px);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0;transition:.16s}
.fab:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-2px)}
.fab svg{width:46px;height:46px;position:absolute;transform:rotate(-90deg)}
.fab.ring{position:relative}
.fab .arrow{font-size:17px;line-height:1}
.fab small{position:absolute;bottom:9px;font-size:9px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="htop">
    <div class="brand">
      <div class="brand-logo">考</div>
      <div style="min-width:0">
        <h1>2029 年度国考备考学习日历</h1>
        <div class="sub" id="heroMeta">行测 / 申论 / 公安专业科目　预计笔试 2028-11 月下旬</div>
      </div>
    </div>
    <div class="hero-right">
      <div class="clock">
        <div class="clock-time" id="clockTime">--:--:--</div>
        <div class="clock-date" id="clockDate">正在加载</div>
      </div>
      <div class="hero-tools">

/* ============ 日期工具 ============ */
const p2 = n => (n < 10 ? '0' : '') + n;
const d2s = d => d.getFullYear() + '-' + p2(d.getMonth()+1) + '-' + p2(d.getDate());
function s2d(s){ const a = s.split('-').map(Number); return new Date(a[0], a[1]-1, a[2]); }
function addDays(s, n){ const d = s2d(s); d.setDate(d.getDate()+n); return d2s(d); }
function mondayOf(s){ const d = s2d(s); return addDays(s, -((d.getDay()+6)%7)); }
function diffDays(a, b){ return Math.round((s2d(b) - s2d(a)) / 86400000); }
function ym(s){ return s.slice(0,7); }
function cnDate(s){ const d = s2d(s); return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'; }
function cnDateShort(s){ const d = s2d(s); return (d.getMonth()+1)+'月'+d.getDate()+'日'; }
function weekdayName(s){ return '星期'+'一二三四五六日'[(s2d(s).getDay()+6)%7]; }
function wdIndex(s){ return (s2d(s).getDay()+6)%7; }
function ymLabel(k){ const a=k.split('-'); return a[0]+'年'+Number(a[1])+'月'; }
function isLastSaturdayOfMonth(s){ return s.slice(0,7) !== addDays(s,7).slice(0,7); }
function isLastDayOfMonth(s){ return addDays(s,1).slice(0,7) !== s.slice(0,7); }

const BASE_WEEK = mondayOf(CFG.start);
const weekIndexOf = s => Math.floor(diffDays(BASE_WEEK, mondayOf(s))/7);
const phaseOf = s => { for(const p of PHASES){ if(s >= p.from && s <= p.to) return p; } return null; };
const nodeOf = s => NODES.find(n => n.d === s) || null;

function rawTasks(ds){

  const c = {ds:ds, ph:ph, wi:wi, wd:wdIndex(ds), weekInPhase:weekInPhase};

  if(node) out.unshift(T('节点', node.t, 30, node.k));

}

const LEC_MAP = (function(){
  const counter = {}, map = {};
  const re = /\{L:([^}]+)\}/g;
  let d = CFG.start;
  while(d <= CFG.end){
    const list = rawTasks(d);
    const per = {};
    for(let i=0;i<list.length;i++){
      const s = String(list[i].t);
      re.lastIndex = 0;
      let m;
      while((m = re.exec(s))){
        const key = m[1];
        counter[key] = (counter[key] || 0) + 1;
        (per[key] = per[key] || []).push(counter[key]);
      }
    }
    map[d] = per;
    d = addDays(d, 1);
  }
  return map;
})();

function tasksFor(ds){
  const list = rawTasks(ds);
  const per = LEC_MAP[ds] || {};
  const used = {};
  const out = list.map(function(t){
    const s = String(t.t);
    if(s.indexOf('{L:') < 0) return t;
    const o = Object.assign({}, t);
    let n = 0;
    o.t = s.replace(/\{L:([^}]+)\}/g, function(_, key){
      used[key] = (used[key] || 0) + 1;
      const nums = per[key] || [];
      n = nums[used[key] - 1] || 0;
      return String(n);
    });
    if(o.t.indexOf('{K}') >= 0){
      const L = COURSE_LESSONS[n - 1];
      o.t = o.t.replace('{K}', L ? L[1] : '超出课程范围');
    }
    return o;
  });
  const kept = out.filter(function(t){ return String(t.t).indexOf('超出课程范围') < 0; });
  const rank = {'行测':0,'申论':1,'公安':2,'常识':3,'模考':4,'自检':5,'复盘':6,'考前':7,'笔试':8,'节点':9,'调整':10};
  return kept.map(function(t,i){ return {t:t, i:i}; })
    .sort(function(a,b){
      const ra = rank[a.t.s] === undefined ? 20 : rank[a.t.s];
      const rb = rank[b.t.s] === undefined ? 20 : rank[b.t.s];
      return ra - rb || a.i - b.i;
    })
    .map(function(x){ return x.t; });
}

function weekFocus(ds){
  const ph = phaseOf(ds);
  if(!ph) return '';
  if(ds >= '2028-11-20') return '最后一周 · 错题与法条回顾';

    return '行测 · '+B.part+' '+B.day+'　申论 · '+slBlock(wip).n+'　公安 · '+ga(wi).n;

  if(ph.id === 4) return '真题第二轮 第 '+wip+' 套　申论 · '+sl(wi).n;

}

function dayProgress(ds){
  const list = tasksFor(ds);
  let total = 0, n = 0;
  for(let i=0;i<list.length;i++){

    total++;
    if(isDone(ds,i)) n++;

  return {total:total, done:n};

/* ============ 计算 ============ */
function allDays(){
  const out = [];
  let d = CFG.start;
  while(d <= CFG.end){ out.push(d); d = addDays(d,1); }
  return out;
}
const ALL_DAYS = allDays();
function totalTasks(){
  let n = 0;
  for(const d of ALL_DAYS) n += tasksFor(d).length;
  return n;
}
function totalDone(){
  let n = 0;
  for(const d of ALL_DAYS) n += dayProgress(d).done;
  return n;
}
function weekDaysOf(weekKey){
  const out = [];
  for(let i=0;i<7;i++){ const d = addDays(weekKey,i); if(d>=CFG.start && d<=CFG.end) out.push(d); }
  return out;
}
function weekProgress(weekKey){
  let total = 0, done = 0;
  for(const d of weekDaysOf(weekKey)){ const p = dayProgress(d); total += p.total; done += p.done; }
  return {total:total, done:done};
}
function monthProgress(k){
  let total = 0, done = 0;
  for(const d of ALL_DAYS){ if(ym(d) !== k) continue; const p = dayProgress(d); total += p.total; done += p.done; }
  return {total:total, done:done};
}
function dday(){
  const t = d2s(new Date());
  return diffDays(t, CFG.exam);
}
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

/* 迷你月历 */
function miniCalCard(){
  const k = state.miniMonth;
  const first = k+'-01';
  const startCell = mondayOf(first);
  const offset = diffDays(startCell, first);
  const dim = new Date(Number(k.slice(0,4)), Number(k.slice(5,7)), 0).getDate();
  const rows = Math.ceil((offset + dim) / 7);
  let cells = '';
  const dow = ['日','一','二','三','四','五','六'];
  for(const w of dow) cells += '<div class="mdow">'+w+'</div>';
  for(let i=0;i<rows*7;i++){
    const ds = addDays(startCell, i);
    const inM = ym(ds) === k;
    const inR = ds >= CFG.start && ds <= CFG.end;
    const cls = ['mcell'];
    if(!inM) cls.push('mout');
    else if(inR) cls.push('mhas');
    if(ds === state.selected) cls.push('msel');
    if(ds === todayKey) cls.push('mtoday');
    if(inM && inR && dayProgress(ds).done > 0) cls.push('mdone');
    cells += '<div class="'+cls.join(' ')+'"'+(inM ? ' data-mdate="'+ds+'"' : '')+'>'+s2d(ds).getDate()+'</div>';
  }
  return '<div class="card" style="margin-bottom:14px">'+
    '<div class="mhead"><span class="mym">'+ymLabel(k)+'</span>'+
      '<button class="mnav expand" id="miniExpand" title="打开详细月历">⤢</button></div>'+
    '<div class="mcal">'+cells+'</div>'+
    '<div class="mfoot"><button class="mnav" id="miniPrev" title="上一月">‹</button>'+
      '<button class="mnav" id="miniNext" title="下一月">›</button></div></div>';
}

/* 时间进度 */
function progressCard(){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const dayOfYear = Math.floor((new Date(y,m,now.getDate()) - new Date(y,0,1))/86400000) + 1;
  const daysInYear = ((y%4===0 && y%100!==0) || y%400===0) ? 366 : 365;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const wd = (now.getDay()+6)%7;
  const rows = [
    {l:'本年', p: dayOfYear/daysInYear*100, left: daysInYear - dayOfYear, u:'天'},
    {l:'本月', p: now.getDate()/daysInMonth*100, left: daysInMonth - now.getDate(), u:'天'},
    {l:'本周', p: (wd+1)/7*100, left: 6 - wd, u:'天'}
  ];
  return '<div class="card" style="margin-bottom:14px"><div class="ctitle"><span>时间进度</span></div>'+
    rows.map(function(r){
      return '<div class="prog"><div class="pt"><span class="pv">'+r.p.toFixed(1)+'%</span>'+
        '<span class="pl">'+r.l+'还剩 '+r.left+' '+r.u+'</span></div>'+
        '<div class="pb"><i style="width:'+Math.min(100,Math.max(0,r.p)).toFixed(1)+'%"></i></div></div>';
    }).join('')+'</div>';
}

/* 距下一个节点 */
function countdownCard(){
  const list = [];
  for(const n of NODES) list.push({d:n.d, t:n.t});
  for(const p of PHASES){ if(p.from > todayKey) list.push({d:p.from, t:'进入阶段 '+p.id+' '+p.name}); }
  list.push({d:CFG.exam, t:'预计笔试'});
  list.sort(function(a,b){ return a.d < b.d ? -1 : 1; });
  const next = list.find(function(x){ return x.d >= todayKey; }) || list[list.length-1];
  const left = diffDays(todayKey, next.d);
  return '<div class="card"><div class="ctitle"><span>下一个节点</span></div>'+
    '<div class="cd"><div><div class="cdl">距离'+esc(next.t)+'</div>'+
    '<div class="cdd">'+cnDate(next.d)+' '+weekdayName(next.d)+'</div></div>'+
    '<div><span class="cdbig">'+left+'</span><span class="cdu">天</span></div></div></div>';
}

function tasksBlock(ds){

/* 自动统计 */
function rangeStats(days){
  let total=0, done=0, doneMins=0, allMins=0, courseDone=0, ztDays=0, bookMax=0, mkDays=0;
  const subj = {};
  for(const d of days){
    const list = tasksFor(d);
    let zt = false, mk = false;
    list.forEach(function(t,i){
      if(t.rest) return;
      total++; allMins += t.m;
      subj[t.s] = subj[t.s] || {total:0, done:0};
      subj[t.s].total++;
      if(!isDone(d,i)) return;
      done++; doneMins += t.m; subj[t.s].done++;
      const s = String(t.t);
      if(s.indexOf('系统课 第') >= 0) courseDone++;
      if(s.indexOf('辅导用书') >= 0){ const m = /DAY\s*(\d+)/.exec(s); if(m) bookMax = Math.max(bookMax, Number(m[1])); }
      if(s.indexOf('字帖') >= 0) zt = true;
      if(s.indexOf('模考') >= 0) mk = true;
    });
    if(zt) ztDays++;
    if(mk) mkDays++;
  }
  return {total:total, done:done, rate: total ? Math.round(done/total*100) : 0, doneMins:doneMins, allMins:allMins,
          courseDone:courseDone, ztDays:ztDays, bookMax:bookMax, mkDays:mkDays, subj:subj};
}
function hm(min){
  const h = Math.floor(min/60), m = min % 60;
  return h ? (h + ' 小时 ' + (m ? m + ' 分' : '整')) : (m + ' 分钟');
}
function subjBars(subj){
  const order = ['行测','申论','公安','常识','模考','自检'];
  return order.filter(function(k){ return subj[k]; }).map(function(k){
    const s = subj[k], r = s.total ? Math.round(s.done/s.total*100) : 0;
    return '<div class="prog"><div class="pt"><span class="pv">'+r+'%</span>'+
      '<span class="pl">'+k+' '+s.done+' / '+s.total+' 项</span></div>'+
      '<div class="pb"><i style="width:'+r+'%"></i></div></div>';
  }).join('');
}

    return '<div class="phcard"><div class="phname"><span class="pdot" style="background:'+p.color+'"></span>阶段 '+p.id+'　'+p.name+'</div>'+
      '<div class="phrange">'+cnDate(a)+' 至 '+cnDate(p.to)+'　共 '+p.weeks+' 周</div>'+
      '<div class="phgoal">'+esc(p.goal)+'</div>'+
      '<div class="phhours">'+esc(p.hours)+'</div>'+
      '<div class="phhours">'+esc(p.note)+'</div>'+
      '<div class="bar" style="margin-top:9px"><i style="width:'+r+'%;background:'+p.color+'"></i></div>'+
      '<div class="small muted" style="margin-top:4px">已完成 '+dn+' / '+tot+' 项</div></div>';
  }).join('');
  const nodes = NODES.map(n=>'<li><div><b>'+cnDate(n.d)+'　'+weekdayName(n.d)+'</b>'+
    '<div class="small muted">'+esc(n.t)+'　'+esc(n.k)+'</div></div></li>').join('');

    '<div class="card"><div class="ctitle"><span>阶段划分</span><span class="small muted">起点 2026-10-09　终点 2028-11-26</span></div>'+

/* ============ 事件 ============ */
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.view === state.view));
  if(state.view === 'overview') renderOverview();
  else if(state.view === 'calendar') renderCalendar();
  else if(state.view === 'week') renderWeek();
  else if(state.view === 'month') renderMonth();
  else if(state.view === 'material') renderMaterials();
  else renderPhase();
  bind();
}
function bind(){
  const v = document.getElementById('view');
  v.querySelectorAll('.ck[data-date]').forEach(ck=>{
    ck.onchange = e=>{ toggleDone(e.target.dataset.date, Number(e.target.dataset.idx)); render(); };
  });
  v.querySelectorAll('.cell[data-date]').forEach(c=>{
    c.onclick = ()=>{ state.selected = c.dataset.date; if(ym(state.selected)!==state.calMonth) state.calMonth = ym(state.selected); render(); };
  });
  const on = (id, fn)=>{ const el = document.getElementById(id); if(el) el.onclick = fn; };
  on('prevM', ()=>{ state.calMonth = shiftMonth(state.calMonth,-1); syncSelection(); render(); });
  on('nextM', ()=>{ state.calMonth = shiftMonth(state.calMonth,1); syncSelection(); render(); });
  on('toToday', ()=>{ state.calMonth = ym(todayKey); state.selected = todayKey; state.weekKey = mondayOf(todayKey); render(); });
  on('toExam', ()=>{ state.calMonth = ym(CFG.exam); state.selected = CFG.exam; render(); });
  on('prevW', ()=>{ state.weekKey = addDays(state.weekKey,-7); render(); });
  on('nextW', ()=>{ state.weekKey = addDays(state.weekKey,7); render(); });
  on('curW', ()=>{ state.weekKey = mondayOf(todayKey); render(); });
  on('prevMo', ()=>{ state.monthKey = shiftMonth(state.monthKey,-1); render(); });
  on('nextMo', ()=>{ state.monthKey = shiftMonth(state.monthKey,1); render(); });
  on('curMo', ()=>{ state.monthKey = ym(todayKey); render(); });
  on('miniPrev', ()=>{ state.miniMonth = shiftMonth(state.miniMonth,-1); render(); });
  on('miniNext', ()=>{ state.miniMonth = shiftMonth(state.miniMonth,1); render(); });
  v.querySelectorAll('.mcell[data-mdate]').forEach(c=>{
    c.onclick = ()=>{
      state.selected = c.dataset.mdate;
      state.calMonth = ym(c.dataset.mdate);
      state.weekKey = mondayOf(c.dataset.mdate);
      state.view = 'calendar';
      render();
      window.scrollTo({top:0,behavior:'smooth'});
    };
  });
  on('miniExpand', ()=>{
    state.calMonth = ym(state.selected);
    state.view = 'calendar';
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  });
  on('calCollapse', ()=>{
    state.view = 'overview';
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  });

  const wk = state.weekKey, rec = wRec(wk);
  v.querySelectorAll('.wchk').forEach(el=>{ el.onchange = e=>{ rec.checks[e.target.dataset.i] = e.target.checked; save(); render(); }; });
  v.querySelectorAll('.wnum').forEach(el=>{ el.onchange = e=>{ rec.nums[e.target.dataset.k] = e.target.value; save(); }; });
  const wt = v.querySelector('.wtext'); if(wt) wt.onchange = e=>{ rec.text = e.target.value; save(); };

  const mk = state.monthKey, mrec = mRec(mk);
  v.querySelectorAll('.mchk').forEach(el=>{ el.onchange = e=>{ mrec.checks[e.target.dataset.i] = e.target.checked; save(); render(); }; });
  v.querySelectorAll('.mnum').forEach(el=>{ el.onchange = e=>{ mrec.nums[e.target.dataset.k] = e.target.value; save(); }; });
  const mt = v.querySelector('.mtext'); if(mt) mt.onchange = e=>{ mrec.text = e.target.value; save(); };
}
function shiftMonth(k, n){
  const a = k.split('-').map(Number);
  const d = new Date(a[0], a[1]-1+n, 1);
  return d.getFullYear()+'-'+p2(d.getMonth()+1);
}
function syncSelection(){
  if(ym(state.selected) === state.calMonth) return;
  let d = state.calMonth + '-01';
  if(d < CFG.start) d = CFG.start;
  if(d > CFG.end) d = CFG.end;
  state.selected = d;
  state.weekKey = mondayOf(d);
}
document.getElementById('tabs').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  state.view = b.dataset.view; render(); window.scrollTo({top:0,behavior:'smooth'});
});

  state.weekKey = mondayOf(todayKey);
  state.monthKey = ym(todayKey);
  state.miniMonth = ym(todayKey);

};
window.addEventListener('scroll', function(){
  const ring = document.getElementById('fabRing');
  if(!ring) return;
  const h = document.documentElement.scrollHeight - window.innerHeight;
  const p = h > 0 ? Math.min(1, Math.max(0, window.scrollY / h)) : 0;
  ring.setAttribute('stroke-dashoffset', String((132 * (1 - p)).toFixed(1)));
});

/* ================= 时钟、主题、光标光晕 ================= */
function p2c(n){ return (n<10?'0':'')+n; }
function updateClocks(){
  const d = new Date();
  const t = p2c(d.getHours())+':'+p2c(d.getMinutes())+':'+p2c(d.getSeconds());
  const ds = d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日　星期'+'日一二三四五六'[d.getDay()];
  const a = document.getElementById('clockTime'); if(a) a.textContent = t;
  const b = document.getElementById('clockDate'); if(b) b.textContent = ds;
}
setInterval(updateClocks, 1000);
updateClocks();

  DB.ui.theme = DB.ui.theme === 'dark' ? 'light' : 'dark';
  save(); applyUi();
};
document.getElementById('hueRange').oninput = e=>{
  if(!DB.ui) DB.ui = {theme:'light', hue:214};
  DB.ui.hue = Number(e.target.value);
  applyUi();
};
document.getElementById('hueRange').onchange = ()=>save();
applyUi();

renderFooter();
render();

const heroMeta = document.getElementById('heroMeta');
if(heroMeta){
  const passed = Math.max(0, diffDays(CFG.start, todayKey) + 1);
  heroMeta.textContent = '行测 / 申论 / 公安专业科目　共 112 周 · ' + totalTasks() + ' 项任务　已坚持 ' + passed + ' 天　预计笔试 2028-11 月下旬';
}
</script>
</body>
